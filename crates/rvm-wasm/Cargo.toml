[package]
name = "rvm-wasm"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Optional WebAssembly guest runtime for the RVM microhypervisor"
keywords = ["hypervisor", "wasm", "webassembly", "no_std"]
categories = ["no-std", "embedded", "wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Pinned: 0.243.0 is the newest wasmparser whose MSRV (1.76) fits the workspace
# MSRV 1.77; later releases need 1.81+. no_std: default features are off and only
# `validate` and `features` are enabled (no serde, no component-model, no
# hash-collections). `features` is needed so `WasmFeatures::WASM2` can be
# pinned and handed to the parser (`Parser::set_features`); without it the
# feature set is wasmparser's compile-time default and cannot be pinned.
wasmparser = { version = "=0.243.0", default-features = false, features = ["validate", "features"], optional = true }
rvm-types = { workspace = true }
rvm-partition = { workspace = true }
rvm-cap = { workspace = true }
rvm-witness = { workspace = true }

[features]
default = []
gpu = []
std = ["alloc", "wasmparser?/std", "rvm-types/std", "rvm-partition/std", "rvm-cap/std", "rvm-witness/std"]
alloc = ["dep:wasmparser", "rvm-types/alloc", "rvm-partition/alloc", "rvm-cap/alloc", "rvm-witness/alloc"]

[dev-dependencies]
proptest = { workspace = true }
wat = "=1.243.0"
peak_alloc = "0.2"

[[test]]
name = "streaming_validator"
required-features = ["std"]

[[test]]
name = "streaming_alloc"
required-features = ["std"]

[[example]]
name = "stream_bench"
required-features = ["std"]

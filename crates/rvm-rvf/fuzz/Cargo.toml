[package]
name = "rvm-rvf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rvm-rvf = { path = "..", features = ["testkit", "std", "parallel-identity"] }
rvm-launch = { path = "../../rvm-launch", features = ["std"] }
rvm-wasm = { path = "../../rvm-wasm", features = ["std"] }
ed25519-dalek = { version = "=2.1.1", default-features = false }
serde_json = "1"

# Not part of the RVM workspace: cargo-fuzz builds with sanitizers on nightly.
[workspace]

[[bin]]
name = "descriptor_decode"
path = "fuzz_targets/descriptor_decode.rs"
test = false
doc = false

[[bin]]
name = "frame_machine"
path = "fuzz_targets/frame_machine.rs"
test = false
doc = false

[[bin]]
name = "admission_session"
path = "fuzz_targets/admission_session.rs"
test = false
doc = false

[[bin]]
name = "identity_worker"
path = "fuzz_targets/identity_worker.rs"
test = false
doc = false
